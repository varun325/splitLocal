<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script>
      // GitHub Pages SPA redirect
      // Encodes path into query string so index.html can restore it
      (function() {
        var l = window.location;
        var base = '/splitLocal/';
        // Get the path after /splitLocal/
        var path = l.pathname.slice(base.length);
        // Redirect to base with path encoded in query
        var target = base + '?p=' + encodeURIComponent(path + l.search + l.hash);
        l.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
